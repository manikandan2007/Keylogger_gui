<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="panel">
            <h1>Keylogger Control Panel</h1>
            
            <div id="message" class="message" style="display: none;"></div>
            
            <div class="button-group">
                <button id="startBtn" class="btn btn-primary" onclick="startKeylogger()">Start Keylogger</button>
                <button id="stopBtn" class="btn btn-danger" onclick="stopKeylogger()" disabled>Stop Keylogger</button>
                <a href="/logs" class="btn btn-secondary">View Logs</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function startKeylogger() {
            fetch('/start')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showMessage(data.message, 'success');
                        document.getElementById('startBtn').disabled = true;
                        document.getElementById('stopBtn').disabled = false;
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(error => showMessage('Error: ' + error, 'error'));
        }

        function stopKeylogger() {
            fetch('/stop')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showMessage(data.message, 'success');
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('stopBtn').disabled = true;
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(error => showMessage('Error: ' + error, 'error'));
        }
    </script>
</body>
</html>
