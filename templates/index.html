<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keylogger Control Panel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="panel">
            <div class="header">
                <i class="fas fa-keyboard icon"></i>
                <h1>Keylogger Control Panel</h1>
                <p class="subtitle">Monitor and control keyboard activity</p>
            </div>

            <div id="status" class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Keylogger is stopped</span>
            </div>

            <div id="message" class="message" style="display: none;"></div>

            <div class="control-section">
                <div class="button-group">
                    <button id="startBtn" class="btn btn-primary" onclick="startKeylogger()">
                        <i class="fas fa-play"></i>
                        Start Keylogger
                    </button>
                    <button id="stopBtn" class="btn btn-danger" onclick="stopKeylogger()" disabled>
                        <i class="fas fa-stop"></i>
                        Stop Keylogger
                    </button>
                </div>

                <div class="secondary-actions">
                    <a href="/logs" class="btn btn-secondary">
                        <i class="fas fa-file-alt"></i>
                        View Logs
                    </a>
                    <button class="btn btn-outline" onclick="clearLogs()">
                        <i class="fas fa-trash"></i>
                        Clear Logs
                    </button>
                </div>
            </div>

            <div class="info-section">
                <div class="info-card">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <h3>How it works</h3>
                        <p>Click Start to begin monitoring keyboard input. All keystrokes will be logged to a file.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }

        function updateStatus(isRunning) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (isRunning) {
                statusDot.className = 'status-dot running';
                statusText.textContent = 'Keylogger is running';
            } else {
                statusDot.className = 'status-dot stopped';
                statusText.textContent = 'Keylogger is stopped';
            }
        }

        function startKeylogger() {
            fetch('/start')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showMessage(data.message, 'success');
                        document.getElementById('startBtn').disabled = true;
                        document.getElementById('stopBtn').disabled = false;
                        updateStatus(true);
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(error => showMessage('Error: ' + error, 'error'));
        }

        function stopKeylogger() {
            fetch('/stop')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        showMessage(data.message, 'success');
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('stopBtn').disabled = true;
                        updateStatus(false);
                    } else {
                        showMessage(data.message, 'error');
                    }
                })
                .catch(error => showMessage('Error: ' + error, 'error'));
        }

        function clearLogs() {
            if (confirm('Are you sure you want to clear all logs? This action cannot be undone.')) {
                fetch('/clear_logs', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        showMessage(data.message, data.status === 'success' ? 'success' : 'error');
                    })
                    .catch(error => showMessage('Error: ' + error, 'error'));
            }
        }

        // Initialize status on page load
        updateStatus(false);
    </script>
</body>
</html>
